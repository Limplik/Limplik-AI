name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install buildozer cython
        sudo apt update
        sudo apt install -y \
          build-essential \
          git \
          python3 \
          python3-pip \
          zip \
          unzip \
          openjdk-17-jdk

    - name: Build APK
      run: |
        buildozer init
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Limplik-AI.apk
        path: bin/*.apk
